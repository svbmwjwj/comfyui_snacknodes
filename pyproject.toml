# pyproject.toml
[build-system]
requires = ["setuptools>=65.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "snacknodes"
description = "Save ComfyUI outputs to your own Google Drive, Cloudflare R2 (10 GB free) or WebDAV server (Nutstore, Nextcloud, NAS...), connected right on the node, optionally end-to-end encrypted as a Cryptomator vault."
version = "2.0.1"
authors = [
    {name = "svbmwjwj", email = "255624542+svbmwjwj@users.noreply.github.com"}
]
readme = "README.md"
license = {text = "GNU General Public License v3"}
dependencies = [
    "requests",
    "cryptography>=42",
]

[project.urls]
Repository = "https://github.com/svbmwjwj/SnackNodes"

[tool.comfy]
PublisherId = "svbmwjwj"
DisplayName = "SnackNodes"
Icon = "https://raw.githubusercontent.com/svbmwjwj/SnackNodes/main/web/icon.png"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib -p no:cacheprovider"

[tool.ruff]
line-length = 120
extend-exclude = ["tests/fake_http.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "B"]
