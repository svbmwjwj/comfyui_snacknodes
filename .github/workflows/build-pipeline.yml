# GitHub CI build pipeline
name: SnackNodes CI build

on:
  pull_request:
    branches:
      - master
      - main
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PYTHONIOENCODING: "utf8"
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Java + Maven run Cryptomator's own cryptofs library against our vaults
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: tests/interop/pom.xml
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt numpy pillow pytest ruff
      - name: Run Linting
        run: ruff check .
      - name: Run Tests
        run: pytest -v
